<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My To-Do List</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg-page: #f0f2f5;
  --bg-card: #ffffff;
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --primary-color: #4F46E5;
  --primary-hover: #4338CA;
  --task-bg: #f7f5fa;
  --task-hover: #eee0f7;
  --stat-bg: #f3f4f6;
}

body.dark-mode {
  --bg-page: #111827;
  --bg-card: #1F2937;
  --text-primary: #F9FAFB;
  --text-secondary: #9CA3AF;
  --primary-color: #6366F1;
  --primary-hover: #818CF8;
  --task-bg: #374151;
  --task-hover: #4B5563;
  --stat-bg: #111827;
}

body {
  background-color: var(--bg-page);
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  margin: 0;
  padding: 40px 15px;
  transition: background-color 0.3s;
}
.app {
  background-color: var(--bg-card);
  width: 100%;
  max-width: 400px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  padding: 25px 20px;
  text-align: center;
  transition: background-color 0.3s;
}
.top-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}
#themeToggle {
  background: none;
  border: 1px solid var(--text-secondary);
  color: var(--text-primary);
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
h1 {
  color: var(--primary-color);
  margin-bottom: 5px;
  font-size: 24px;
}
.hint {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.stat-box {
  background-color: var(--stat-bg);
  border-radius: 8px;
  padding: 12px;
}
.stat-number {
  font-size: 22px;
  font-weight: bold;
  color: var(--primary-color);
  margin: 0;
}
.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin: 4px 0 0;
}
.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
input, select {
  padding: 10px;
  font-size: 15px;
  border: 1px solid var(--text-secondary);
  border-radius: 8px;
  background-color: var(--bg-card);
  color: var(--text-primary);
}
input {
  flex: 1;
}
button {
  padding: 10px 16px;
  font-size: 15px;
  background-color: var(--primary-color);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
button:hover {
  background-color: var(--primary-hover);
}
.error {
  color: #DC2626;
  font-size: 13px;
  margin: -5px 0 10px;
  text-align: left;
  display: none;
}
ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
li {
  background-color: var(--task-bg);
  color: var(--text-primary);
  margin-bottom: 8px;
  padding: 12px;
  border-radius: 8px;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
li:hover {
  background-color: var(--task-hover);
}
.priority-tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: bold;
}
.priority-High { background-color: #FEE2E2; color: #991B1B; }
.priority-Medium { background-color: #FEF3C7; color: #92400E; }
.priority-Low { background-color: #D1FAE5; color: #065F46; }
</style>
</head>
<body>

<div class="app">
  <div class="top-row">
    <button id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
  </div>
  <h1>My To-Do List</h1>
  <p class="hint">Tap a task to remove it</p>

  <div class="stats">
    <div class="stat-box">
      <p class="stat-number" id="totalCount">0</p>
      <p class="stat-label">Total tasks</p>
    </div>
    <div class="stat-box">
      <p class="stat-number" id="remainingCount">0</p>
      <p class="stat-label">Remaining</p>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Enter a task">
    <select id="priorityInput">
      <option value="Low">Low</option>
      <option value="Medium" selected>Medium</option>
      <option value="High">High</option>
    </select>
  </div>
  <p class="error" id="errorMsg">Please enter a task first.</p>
  <div class="input-row">
    <button onclick="addTask()" style="width:100%;">Add Task</button>
  </div>

  <ul id="taskList"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function updateStats() {
  document.getElementById("totalCount").innerHTML = tasks.length;
  document.getElementById("remainingCount").innerHTML = tasks.length;
}

function renderTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";
  for (let i = 0; i < tasks.length; i++) {
    let task = tasks[i];
    let newItem = document.createElement("li");
    newItem.innerHTML = `
      <span>${task.text}</span>
      <span class="priority-tag priority-${task.priority}">${task.priority}</span>
    `;
    newItem.onclick = function() {
      tasks.splice(i, 1);
      saveTasks();
      renderTasks();
    };
    list.appendChild(newItem);
  }
  updateStats();
}

function addTask() {
  let taskText = document.getElementById("taskInput").value;
  let priority = document.getElementById("priorityInput").value;
  let errorMsg = document.getElementById("errorMsg");

  if (taskText.trim() === "") {
    errorMsg.style.display = "block";
    return;
  }
  errorMsg.style.display = "none";

  tasks.push({ text: taskText, priority: priority });
  saveTasks();
  renderTasks();
  document.getElementById("taskInput").value = "";
}

function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  let isDark = document.body.classList.contains("dark-mode");
  localStorage.setItem("darkMode", isDark);
  document.getElementById("themeToggle").innerHTML = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark-mode");
  document.getElementById("themeToggle").innerHTML = "☀️ Light Mode";
}

renderTasks();
</script>
</body>
</html>
