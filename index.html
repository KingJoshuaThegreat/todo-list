<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My To-Do List</title>
<style>
* { box-sizing: border-box; }
:root {
  --bg-page: #f0f2f5; --bg-card: #ffffff; --text-primary: #111827;
  --text-secondary: #6B7280; --primary-color: #4F46E5; --primary-hover: #4338CA;
  --task-bg: #f7f5fa; --task-hover: #eee0f7; --stat-bg: #f3f4f6;
}
body.dark-mode {
  --bg-page: #111827; --bg-card: #1F2937; --text-primary: #F9FAFB;
  --text-secondary: #9CA3AF; --primary-color: #6366F1; --primary-hover: #818CF8;
  --task-bg: #374151; --task-hover: #4B5563; --stat-bg: #111827;
}
body {
  background-color: var(--bg-page); font-family: 'Segoe UI', Arial, sans-serif;
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; margin: 0; padding: 40px 15px; transition: background-color 0.3s;
}
.app {
  background-color: var(--bg-card); width: 100%; max-width: 400px;
  border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  padding: 25px 20px; text-align: center; transition: background-color 0.3s;
}
.top-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
#themeToggle {
  background: none; border: 1px solid var(--text-secondary); color: var(--text-primary);
  padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
}
h1 { color: var(--primary-color); margin-bottom: 5px; font-size: 24px; }
.hint { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.stat-box { background-color: var(--stat-bg); border-radius: 8px; padding: 12px; }
.stat-number { font-size: 22px; font-weight: bold; color: var(--primary-color); margin: 0; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin: 4px 0 0; }
#openModalBtn {
  width: 100%; padding: 12px; font-size: 15px; background-color: var(--primary-color);
  color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 15px;
}
#openModalBtn:hover { background-color: var(--primary-hover); }
.filter-row { display: flex; gap: 6px; margin-bottom: 15px; }
.filter-btn {
  flex: 1; padding: 8px 4px; font-size: 12px; border: 1px solid var(--text-secondary);
  background-color: transparent; color: var(--text-primary); border-radius: 6px; cursor: pointer;
}
.filter-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
ul { list-style: none; padding: 0; margin: 0; }
li {
  background-color: var(--task-bg); color: var(--text-primary); margin-bottom: 8px;
  padding: 12px; border-radius: 8px; text-align: left; cursor: pointer;
  transition: background-color 0.2s; display: flex; justify-content: space-between; align-items: center;
}
li:hover { background-color: var(--task-hover); }
li.completed span.task-text { text-decoration: line-through; color: var(--text-secondary); }
.task-left { display: flex; align-items: center; gap: 10px; flex: 1; }
.priority-tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: bold; margin-right: 8px; }
.priority-High { background-color: #FEE2E2; color: #991B1B; }
.priority-Medium { background-color: #FEF3C7; color: #92400E; }
.priority-Low { background-color: #D1FAE5; color: #065F46; }
.delete-btn {
  background: none; border: none; color: var(--text-secondary); font-size: 18px;
  cursor: pointer; padding: 0 4px; line-height: 1;
}
.empty-msg { color: var(--text-secondary); font-size: 13px; padding: 20px 0; }
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; z-index: 10;
}
.modal-overlay.active { display: flex; }
.modal-box { background-color: var(--bg-card); border-radius: 12px; padding: 20px; width: 100%; max-width: 340px; text-align: left; }
.modal-box h2 { color: var(--text-primary); font-size: 18px; margin: 0 0 15px; }
.modal-box label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.modal-box input, .modal-box select {
  width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--text-secondary);
  border-radius: 8px; background-color: var(--bg-page); color: var(--text-primary); margin-bottom: 12px;
}
.modal-error { color: #DC2626; font-size: 13px; margin: -8px 0 12px; display: none; }
.modal-buttons { display: flex; gap: 10px; }
.modal-buttons button { flex: 1; padding: 10px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; }
#cancelBtn { background-color: var(--stat-bg); color: var(--text-primary); }
#confirmAddBtn { background-color: var(--primary-color); color: white; }
</style>
</head>
<body>

<div class="app">
  <div class="top-row">
    <button id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
  </div>
  <h1>My To-Do List</h1>
  <p class="hint">Tap a task to mark it done. Use × to delete.</p>

  <div class="stats">
    <div class="stat-box">
      <p class="stat-number" id="totalCount">0</p>
      <p class="stat-label">Total tasks</p>
    </div>
    <div class="stat-box">
      <p class="stat-number" id="remainingCount">0</p>
      <p class="stat-label">Remaining</p>
    </div>
  </div>

  <button id="openModalBtn" onclick="openModal()">+ Add Task</button>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
    <button class="filter-btn" onclick="setFilter('Low', this)">Low</button>
    <button class="filter-btn" onclick="setFilter('Medium', this)">Medium</button>
    <button class="filter-btn" onclick="setFilter('High', this)">High</button>
  </div>

  <ul id="taskList"></ul>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2>Add new task</h2>
    <label>Task title</label>
    <input type="text" id="taskInput" placeholder="Enter a task">
    <label>Priority</label>
    <select id="priorityInput">
      <option value="Low">Low</option>
      <option value="Medium" selected>Medium</option>
      <option value="High">High</option>
    </select>
    <p class="modal-error" id="errorMsg">Please enter a task first.</p>
    <div class="modal-buttons">
      <button id="cancelBtn" onclick="closeModal()">Cancel</button>
      <button id="confirmAddBtn" onclick="addTask()">Add Task</button>
    </div>
  </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let currentFilter = "All";

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function updateStats() {
  document.getElementById("totalCount").innerHTML = tasks.length;
  let remaining = tasks.filter(function(task) { return !task.completed; });
  document.getElementById("remainingCount").innerHTML = remaining.length;
}

function setFilter(filterValue, buttonEl) {
  currentFilter = filterValue;
  let allButtons = document.querySelectorAll(".filter-btn");
  for (let i = 0; i < allButtons.length; i++) {
    allButtons[i].classList.remove("active");
  }
  buttonEl.classList.add("active");
  renderTasks();
}

function renderTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  let visibleTasks = tasks;
  if (currentFilter !== "All") {
    visibleTasks = tasks.filter(function(task) {
      return task.priority === currentFilter;
    });
  }

  if (visibleTasks.length === 0) {
    list.innerHTML = '<p class="empty-msg">No tasks here yet</p>';
    updateStats();
    return;
  }

  for (let i = 0; i < visibleTasks.length; i++) {
    let task = visibleTasks[i];
    let newItem = document.createElement("li");
    if (task.completed) {
      newItem.classList.add("completed");
    }
    newItem.innerHTML = `
      <div class="task-left">
        <span class="priority-tag priority-${task.priority}">${task.priority}</span>
        <span class="task-text">${task.text}</span>
      </div>
      <button class="delete-btn">×</button>
    `;
    newItem.onclick = function() {
      let realIndex = tasks.indexOf(task);
      tasks[realIndex].completed = !tasks[realIndex].completed;
      saveTasks();
      renderTasks();
    };
    newItem.querySelector(".delete-btn").onclick = function(event) {
      event.stopPropagation();
      let realIndex = tasks.indexOf(task);
      tasks.splice(realIndex, 1);
      saveTasks();
      renderTasks();
    };
    list.appendChild(newItem);
  }
  updateStats();
}

function openModal() {
  document.getElementById("modalOverlay").classList.add("active");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
  document.getElementById("errorMsg").style.display = "none";
  document.getElementById("taskInput").value = "";
}

function addTask() {
  let taskText = document.getElementById("taskInput").value;
  let priority = document.getElementById("priorityInput").value;
  let errorMsg = document.getElementById("errorMsg");

  if (taskText.trim() === "") {
    errorMsg.style.display = "block";
    return;
  }

  tasks.push({ text: taskText, priority: priority, completed: false });
  saveTasks();
  renderTasks();
  closeModal();
}

function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  let isDark = document.body.classList.contains("dark-mode");
  localStorage.setItem("darkMode", isDark);
  document.getElementById("themeToggle").innerHTML = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark-mode");
  document.getElementById("themeToggle").innerHTML = "☀️ Light Mode";
}

renderTasks();
</script>
</body>
                                                </html>
