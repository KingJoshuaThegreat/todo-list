<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My To-Do List</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg-page: #f0f2f5;
  --bg-card: #ffffff;
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --primary-color: #4F46E5;
  --primary-hover: #4338CA;
  --task-bg: #f7f5fa;
  --task-hover: #eee0f7;
}

body.dark-mode {
  --bg-page: #111827;
  --bg-card: #1F2937;
  --text-primary: #F9FAFB;
  --text-secondary: #9CA3AF;
  --primary-color: #6366F1;
  --primary-hover: #818CF8;
  --task-bg: #374151;
  --task-hover: #4B5563;
}

body {
  background-color: var(--bg-page);
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  margin: 0;
  padding: 40px 15px;
  transition: background-color 0.3s;
}
.app {
  background-color: var(--bg-card);
  width: 100%;
  max-width: 400px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  padding: 25px 20px;
  text-align: center;
  transition: background-color 0.3s;
}
.top-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}
#themeToggle {
  background: none;
  border: 1px solid var(--text-secondary);
  color: var(--text-primary);
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
h1 {
  color: var(--primary-color);
  margin-bottom: 5px;
  font-size: 24px;
}
.hint {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}
.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}
input {
  flex: 1;
  padding: 10px;
  font-size: 15px;
  border: 1px solid var(--text-secondary);
  border-radius: 8px;
  background-color: var(--bg-card);
  color: var(--text-primary);
}
button {
  padding: 10px 16px;
  font-size: 15px;
  background-color: var(--primary-color);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
button:hover {
  background-color: var(--primary-hover);
}
ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
li {
  background-color: var(--task-bg);
  color: var(--text-primary);
  margin-bottom: 8px;
  padding: 12px;
  border-radius: 8px;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.2s;
}
li:hover {
  background-color: var(--task-hover);
}
</style>
</head>
<body>

<div class="app">
  <div class="top-row">
    <button id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
  </div>
  <h1>My To-Do List</h1>
  <p class="hint">Tap a task to remove it</p>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>
  </div>

  <ul id="taskList"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function renderTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";
  for (let i = 0; i < tasks.length; i++) {
    let newItem = document.createElement("li");
    newItem.innerHTML = tasks[i];
    newItem.onclick = function() {
      tasks.splice(i, 1);
      saveTasks();
      renderTasks();
    };
    list.appendChild(newItem);
  }
}

function addTask() {
  let taskText = document.getElementById("taskInput").value;
  if (taskText.trim() === "") return;
  tasks.push(taskText);
  saveTasks();
  renderTasks();
  document.getElementById("taskInput").value = "";
}

function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  let isDark = document.body.classList.contains("dark-mode");
  localStorage.setItem("darkMode", isDark);
  document.getElementById("themeToggle").innerHTML = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark-mode");
  document.getElementById("themeToggle").innerHTML = "☀️ Light Mode";
}

renderTasks();
</script>
</body>
</html>
